<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Portal</title>

<style>
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center
}
.container{
width:90%;
max-width:500px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
padding:40px;
border-radius:20px;
text-align:center;
color:white
}
input,textarea{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.2);
color:white
}
button{
padding:15px 25px;
border:none;
border-radius:25px;
cursor:pointer;
color:white;
margin:5px
}
.chat-messages{
height:400px;
overflow-y:auto;
background:rgba(255,255,255,0.1);
padding:15px;
border-radius:10px;
text-align:left
}
.message{
background:rgba(255,255,255,0.2);
padding:10px;
border-radius:10px;
margin-bottom:10px
}
</style>
</head>

<body>
<div class="container">

<div id="loginScreen">
<h1>Secure Portal</h1>
<input type="password" id="passwordInput" placeholder="Enter password">
<button onclick="checkPassword()">Enter</button>
<p id="error"></p>
</div>

<div id="chatScreen" style="display:none">
<h1>Global Chat</h1>

<button onclick="clearAllMessages()" style="background:#d63031">
Clear All Messages
</button>

<div id="chatMessages" class="chat-messages"></div>

<input id="messageInput" placeholder="Type message">
<button onclick="sendMessage()" style="background:#00b894">Send</button>

<button onclick="goBack()" style="background:#6c5ce7">Back</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyDNT7l1mg6AilumYFki_Ui7-HKPma5nBkc",
authDomain:"chat-5737d.firebaseapp.com",
databaseURL:"https://chat-5737d-default-rtdb.firebaseio.com",
projectId:"chat-5737d"
}

firebase.initializeApp(firebaseConfig)
const db=firebase.database()
const messagesRef=db.ref("globalChat/messages")

function checkPassword(){
const p=passwordInput.value
if(p==="2580"){
loginScreen.style.display="none"
chatScreen.style.display="block"
loadMessages()
removeRitaMessages()
}else{
error.textContent="Wrong password"
}
passwordInput.value=""
}

function goBack(){
chatScreen.style.display="none"
loginScreen.style.display="block"
}

function sendMessage(){
const text=messageInput.value.trim()
if(!text)return
messagesRef.push({
text:text,
timestamp:Date.now()
})
messageInput.value=""
}

function loadMessages(){
messagesRef.on("value",snap=>{
chatMessages.innerHTML=""
snap.forEach(child=>{
const div=document.createElement("div")
div.className="message"
div.textContent=child.val().text
chatMessages.appendChild(div)
})
chatMessages.scrollTop=chatMessages.scrollHeight
})
}

function clearAllMessages(){
if(confirm("Delete all messages permanently?")){
messagesRef.remove()
}
}

function removeRitaMessages(){
messagesRef.once("value",snap=>{
snap.forEach(child=>{
const t=(child.val().text||"").toLowerCase()
if(t.includes("rita")){
child.ref.remove()
}
})
})
}
</script>

</body>
</html>
